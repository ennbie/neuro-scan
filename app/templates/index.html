<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Tumor Detection</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
  <div class="container text-center mt-5">
    <h1 class="mb-4">🧠 Brain Tumor Detection</h1>
    
    <div class="card p-4 shadow-lg">
      <input type="file" id="file-input" class="form-control mb-3" accept="image/*">
      <button id="predict-btn" class="btn btn-primary w-100">Predict</button>

      <div class="mt-4">
        <h5 id="result"></h5>
        <div class="progress mt-2" style="height: 25px;">
          <div id="confidence-bar" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/script.js"></script>
</body>
</html>
