<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NeuroScan — Diagnose</title>

  <link rel="icon" type="image/x-icon" href="/static/images/brain-icon-1.png">

  <!-- Bootstrap (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/css/index.css">
  <link rel="stylesheet" href="/static/css/diagnose.css">
</head>
<body>

<nav class="navbar bg-dark navbar-expand-sm sticky-top shadow-sm" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
      <img src="/static/images/brain-icon-1.png" alt="NeuroScan logo" width="25" height="25" class="d-inline-block align-text-top me-2" loading="lazy">
      NeuroScan
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/diagnose">Diagnose</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/about">About</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-4">
  <div class="row g-4">

    <!-- Left column: Upload / Results -->
    <div class="col-lg-8">
      <div class="card p-3 shadow-sm">

        <label for="file-input">
          <h4>Upload MRI Scans</h4>
        </label>
        <input class="form-control my-3" type="file" id="file-input" accept="image/*" multiple aria-label="Upload MRI images">
          

        <!-- Drag & drop zone -->
        <div id="drop-zone" class="drop-zone mb-3">
          <div class="dz-inner text-center">
            <img src="/static/images/brain-icon-1.png" alt="brain" class="dz-img mb-2" />
            <p class="mb-1">Drag & drop images here (JPG / PNG)</p>
            <small class="text-muted d-block mt-2">Batch uploads supported</small>

          </div>
        </div>

        <!-- Active upload/result list -->
        <div id="results-container" class="mt-3">
          <!-- JS will insert result cards here -->
        </div>

      </div>
    </div>

    <!-- Right column: Session history -->
    <div class="col-lg-4">
      <div class="card p-3 shadow-sm">
        <div class="d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Session History</h5>
          <div>
            <button id="clear-history" class="btn btn-sm btn-outline-danger">Clear</button>
          </div>
        </div>

        <hr/>

        <div id="history-list" class="history-list">
          <!-- JS will render history items -->
        </div>
      </div>

      <div class="mt-3 text-center text-muted small">
        <p>History persists for this browser tab.</p>
      </div>
    </div>

  </div>
</main>

<!-- Footer -->
<footer class="py-4 text-center text-muted bg-white border-top">
  <div class="container">
    <p class="mb-0 small">© 2025 NeuroScan — Brain Tumor Detection System | Built with ❤️ by ennbie.</p>
  </div>
</footer>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/static/js/diagnose.js"></script>
</body>
</html>
